<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LocalFix - Admin</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

<nav>

    <div class="logo">
        LocalFix
    </div>

    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="services.html">
            Services
        </a>

        <a href="bookings.html">
            My Bookings
        </a>

    </div>

</nav>


<section class="categories">

    <h2>
        Booking Management
    </h2>

    <div id="adminBookings">

        <p>
            Loading bookings...
        </p>

    </div>

</section>


<footer>

    <p>
        © 2026 LocalFix. All rights reserved.
    </p>

</footer>


<script src="js/app.js"></script>


<script>

async function loadBookings() {

    const container =
        document.getElementById(
            "adminBookings"
        );


    const token =
        localStorage.getItem(
            "access_token"
        );


    if (!token) {

        container.innerHTML = `
            <p>Please login first.</p>
        `;

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/bookings/`,
                {
                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        const bookings =
            await response.json();


        if (!response.ok) {

            throw new Error(
                bookings.detail ||
                "Could not load bookings"
            );

        }


        container.innerHTML = "";


        if (bookings.length === 0) {

            container.innerHTML = `
                <p>No bookings found.</p>
            `;

            return;

        }


        bookings.forEach(
            booking => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "booking-card";


                card.innerHTML = `

                    <h3>
                        ${booking.service}
                    </h3>

                    <p>
                        📅 ${booking.date}
                    </p>

                    <p>
                        🕐 ${booking.time}
                    </p>

                    <p>
                        📍 ${booking.address}
                    </p>

                    <p>
                        👨‍🔧
                        ${
                            booking.provider
                                ? booking.provider.name
                                : "Unknown Provider"
                        }
                    </p>

                    <p>
                        <strong>
                            Status:
                        </strong>

                        <span class="status">
                            ${booking.status}
                        </span>
                    </p>


                    <select
                        id="status-${booking._id}"
                    >

                        <option value="Pending">
                            Pending
                        </option>

                        <option value="Confirmed">
                            Confirmed
                        </option>

                        <option value="Completed">
                            Completed
                        </option>

                        <option value="Cancelled">
                            Cancelled
                        </option>

                    </select>


                    <button
                        onclick="updateStatus(
                            '${booking._id}'
                        )"
                    >
                        Update Status
                    </button>

                `;


                container.appendChild(
                    card
                );


                document.getElementById(
                    `status-${booking._id}`
                ).value =
                    booking.status;

            }
        );

    }


    catch (error) {

        console.error(error);

        container.innerHTML = `
            <p>
                Could not load bookings.
            </p>
        `;

    }

}



async function updateStatus(
    bookingId
) {

    const status =
        document.getElementById(
            `status-${bookingId}`
        ).value;


    const token =
        localStorage.getItem(
            "access_token"
        );


    try {

        const response =
            await fetch(

                `${API_URL}/bookings/${bookingId}/status`,

                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${token}`

                    },

                    body: JSON.stringify({
                        status: status
                    })

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.detail ||
                "Could not update status"
            );

            return;

        }


        alert(
            "Booking status updated!"
        );


        loadBookings();

    }


    catch (error) {

        console.error(error);

        alert(
            "Could not connect to server."
        );

    }

}


loadBookings();

</script>

</body>

</html>
